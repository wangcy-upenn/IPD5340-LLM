<meta charset="utf-8">
<title>Time Bubble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  :root{ --sign:#2A2D63; --amber:#F2B233; --red:#E33B3B; --chip:#4A5058;
         --glow:#5BD6A0; --line:#23262B; }
  *{ box-sizing:border-box; margin:0; }
  html,body{ height:100%; }
  body{ background:#0A0A0B; color:#fff; font-family:"Barlow",system-ui,sans-serif;
        display:flex; justify-content:center; overflow:hidden;
        -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none; }
  #unit{ width:100%; max-width:540px; height:100%; display:flex; flex-direction:column;
         background:#000; position:relative; }

  /* Slim status strip - the bus is context here, not the headline. */
  .bar{ flex:0 0 auto; display:flex; align-items:center; gap:clamp(7px,1.8vw,11px);
        background:var(--sign); padding:clamp(6px,1.1vh,11px) clamp(11px,3vw,18px); }
  .bar .lbl{ font-family:"Barlow Condensed",sans-serif; font-weight:600; color:#9FA3D8;
             font-size:clamp(9.5px,1.3vh,12px); letter-spacing:.15em; text-transform:uppercase; }
  .bar .chip{ background:var(--chip); border-radius:5px; padding:1px 8px;
              font-family:"Barlow Condensed",sans-serif; font-weight:700;
              font-size:clamp(15px,2vh,20px); line-height:1.2; }
  .bar .dest{ flex:1 1 auto; min-width:0; font-weight:600; font-size:clamp(12px,1.6vh,15px);
              white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#D6D8F0; }
  .bar .delay{ display:none; background:var(--red); border-radius:999px; padding:1px 8px;
               font-family:"Barlow Condensed",sans-serif; font-weight:700;
               font-size:clamp(9.5px,1.3vh,12px); letter-spacing:.07em; text-transform:uppercase; }
  body.late .bar .delay{ display:block; }
  .bar .mins{ font-family:"Barlow Condensed",sans-serif; font-weight:700; color:var(--amber);
              font-size:clamp(17px,2.4vh,23px); font-variant-numeric:tabular-nums; }
  .bar .lv{ font-family:"Barlow Condensed",sans-serif; font-weight:600; color:#8E92C9;
            font-size:clamp(9px,1.2vh,11px); letter-spacing:.13em; text-transform:uppercase; }
  .bar .lv.on{ color:#7BE0A0; }

  /* The headline is the answer; the map underneath is the evidence. */
  .head{ flex:0 0 auto; padding:clamp(9px,1.7vh,16px) clamp(12px,3.2vw,20px) clamp(7px,1.2vh,12px); }
  .head .big{ font-family:"Barlow Condensed",sans-serif; font-weight:700; line-height:.94;
              font-size:clamp(30px,5.4vh,52px); letter-spacing:.005em; }
  .head .big b{ color:var(--glow); font-weight:700; }
  .head .sub{ margin-top:clamp(3px,.6vh,7px); color:#8A929E;
              font-size:clamp(11.5px,1.6vh,15px); line-height:1.35; }
  body.arriving .head .big b{ color:var(--amber); }

  .stage{ flex:1 1 auto; position:relative; min-height:0;
          margin:0 clamp(9px,2.4vw,14px) clamp(6px,1.1vh,10px);
          border-radius:10px; overflow:hidden; background:#333A47; }
  .stage svg{ position:absolute; inset:0; width:100%; height:100%; }

  .st{ fill:#A3ACBB; font-family:"Barlow",sans-serif; font-weight:600; font-size:9.2px;
       letter-spacing:.35px; paint-order:stroke; stroke:#333A47; stroke-width:2.6; stroke-linejoin:round; }
  .halo{ fill:rgba(76,147,240,.22); }
  .me{ fill:#2E7DF0; stroke:#fff; stroke-width:3; }
  .melbl{ fill:#fff; font-family:"Barlow",sans-serif; font-weight:700; font-size:15px;
          paint-order:stroke; stroke:#2B313D; stroke-width:3.4; }

  /* The bubble: everywhere you can walk to and get back before the bus. */
  #bubble{ fill:rgba(91,214,160,.13); stroke:#5BD6A0; stroke-width:3;
           transition:d .9s cubic-bezier(.34,.02,.2,1), opacity .5s ease; }
  #bubbleGlow{ fill:none; stroke:rgba(91,214,160,.28); stroke-width:9;
               transition:d .9s cubic-bezier(.34,.02,.2,1), opacity .5s ease; }

  .pl{ transition:opacity .5s ease; }
  .pl .dot{ stroke:#0E1218; stroke-width:2.5; }
  .pl .nm{ font-family:"Barlow",sans-serif; font-weight:700; font-size:21px; fill:#fff;
           paint-order:stroke; stroke:#20262F; stroke-width:4.5; stroke-linejoin:round; }
  .pl .mn{ font-family:"Barlow",sans-serif; font-weight:600; font-size:15px; fill:#C3CBD6;
           paint-order:stroke; stroke:#20262F; stroke-width:4; stroke-linejoin:round; }
  .pl.out{ opacity:.34; }
  .pl.in .mn{ fill:var(--glow); }
  .pl.food .dot{ fill:#F0A93C; } .pl.transit .dot{ fill:#4C93F0; }
  .pl.park .dot{ fill:#5AA469; } .pl.arts .dot{ fill:#A874D8; }
  .pl.civic .dot{ fill:#C3A469; }

  .foot{ flex:0 0 auto; display:flex; justify-content:space-between; gap:12px;
         padding:0 clamp(12px,3vw,18px) clamp(7px,1.2vh,12px);
         font-family:"Barlow Condensed",sans-serif; letter-spacing:.14em; text-transform:uppercase;
         font-size:clamp(9px,1.2vh,11.5px); color:#5A6069; }

  #flash{ position:absolute; inset:0; display:grid; place-items:center; pointer-events:none;
          background:#000; opacity:0; transition:opacity .3s ease; }
  #flash.on{ opacity:1; }
  #flash .r{ font-family:"Barlow Condensed",sans-serif; font-weight:700; color:var(--amber);
             font-size:clamp(110px,24vh,220px); line-height:.85; text-align:center; }
  #flash .w{ font-family:"Barlow Condensed",sans-serif; font-weight:600; color:#fff;
             font-size:clamp(22px,4.4vh,42px); letter-spacing:.22em;
             text-transform:uppercase; text-align:center; }
</style>

<script>
(function(){
  var NS = "http://www.w3.org/2000/svg";
  var $ = function(id){ return document.getElementById(id); };
  var SX = 320.8, SY = 456.9;

  // Map units walked per minute, measured along the street grid rather than
  // straight through buildings. Every walk time on this screen comes from this
  // one number, so the ring and the labels can never disagree.
  var UNITS_PER_MIN = 49.2;
  var TURNAROUND = 1;   // minutes spent at the far end before turning back
  var ARRIVE_MS = 5200;

  var PLACES = [{"id":"midtown","nm":"Midtown Village","cat":"food","x":165.3,"y":404.4,"tx":0,"anc":"middle","d":208.0,"walk":4},{"id":"jefferson","nm":"Jefferson Station","cat":"transit","x":379.2,"y":243.1,"tx":0,"anc":"middle","d":272.2,"walk":6},{"id":"reading","nm":"Reading Terminal","cat":"food","x":243.1,"y":169.2,"tx":0,"anc":"middle","d":365.4,"walk":7},{"id":"washington","nm":"Washington Square","cat":"park","x":663.1,"y":495.8,"tx":-16,"anc":"end","d":381.2,"walk":8},{"id":"cityhall","nm":"City Hall","cat":"civic","x":87.5,"y":243.1,"tx":16,"anc":"start","d":447.1,"walk":9},{"id":"kimmel","nm":"Kimmel Center","cat":"arts","x":79.7,"y":593.1,"tx":16,"anc":"start","d":377.3,"walk":8}];

  var ROUTES = ["9", "12", "21", "42"];
  var SEED = { "9":16, "12":9, "21":12, "42":7 };
  var eta = { "9":16, "12":9, "21":12, "42":7 };
  var lateMin = { "9":null, "12":null, "21":null, "42":null };
  var dest = { "9":"Andorra", "12":"50th-Woodland",
               "21":"69th St Transit Center", "42":"Wycombe" };
  var tracked = { "9":true, "12":true, "21":true, "42":true };
  var arriving = null, live = false, demoSpeed = false, tickHandle = null;
  var POLL_MS = 20000, DEMO_MIN_MS = 2000, REAL_MIN_MS = 60000;

  function el(name, attrs, cls){
    var e = document.createElementNS(NS, name);
    if(cls) e.setAttribute("class", cls);
    for(var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // ---- places --------------------------------------------------------------
  var pnodes = {};
  var layer = $("places");
  PLACES.forEach(function(p){
    var g = el("g", {}, "pl " + p.cat);
    g.appendChild(el("circle", { cx:p.x, cy:p.y, r:9 }, "dot"));
    var nm = el("text", { x:p.x + p.tx, y:p.y - 30, "text-anchor":p.anc }, "nm");
    nm.textContent = p.nm;
    var mn = el("text", { x:p.x + p.tx, y:p.y - 11, "text-anchor":p.anc }, "mn");
    mn.textContent = p.walk + " min walk";
    g.appendChild(nm); g.appendChild(mn);
    layer.appendChild(g);
    pnodes[p.id] = { g:g, mn:mn };
  });

  // ---- the bubble ----------------------------------------------------------
  // In a grid you cannot walk diagonally through blocks, so equal walking time
  // traces a diamond, not a circle. Softened with quadratic curves so it reads
  // as a reachable area rather than a geometric figure.
  function bubblePath(R){
    if(R <= 0) return "";
    var k = R * 0.55;
    return "M " + SX + " " + (SY - R) +
           " Q " + (SX + k) + " " + (SY - k) + " " + (SX + R) + " " + SY +
           " Q " + (SX + k) + " " + (SY + k) + " " + SX + " " + (SY + R) +
           " Q " + (SX - k) + " " + (SY + k) + " " + (SX - R) + " " + SY +
           " Q " + (SX - k) + " " + (SY - k) + " " + SX + " " + (SY - R) + " Z";
  }

  function soonest(){
    var best = null;
    ROUTES.forEach(function(r){
      if(!tracked[r]) return;
      if(best === null || eta[r] < eta[best]) best = r;
    });
    return best;
  }

  function draw(){
    var r = soonest();

    if(r === null){
      $("chip").textContent = "--";
      $("dest").textContent = "No bus being tracked right now";
      $("mins").textContent = "--";
      document.body.classList.remove("late");
      $("big").innerHTML = "No bus tracked";
      $("sub").textContent = "SEPTA is not reporting a vehicle heading this way.";
      $("bubble").setAttribute("d", ""); $("bubbleGlow").setAttribute("d", "");
      PLACES.forEach(function(p){ pnodes[p.id].g.setAttribute("class", "pl " + p.cat + " out"); });
      $("count").textContent = "waiting for data";
      return;
    }

    var m = eta[r];
    $("chip").textContent = r;
    $("dest").textContent = dest[r] || "";
    $("mins").textContent = m;

    var lm = lateMin[r];
    document.body.classList.toggle("late", typeof lm === "number" && lm >= 2);
    if(typeof lm === "number" && lm >= 2) $("delay").textContent = "Delayed " + lm + " min";

    // Out and back, with a minute to actually do something at the far end.
    var reachMin = Math.max(0, (m - TURNAROUND) / 2);
    var R = reachMin * UNITS_PER_MIN;

    $("bubble").setAttribute("d", bubblePath(R));
    $("bubbleGlow").setAttribute("d", bubblePath(R));

    var n = 0;
    PLACES.forEach(function(p){
      var inside = p.d <= R;
      if(inside) n++;
      pnodes[p.id].g.setAttribute("class", "pl " + p.cat + (inside ? " in" : " out"));
    });

    if(reachMin < 1){
      $("big").innerHTML = "Stay <b>put</b>";
      $("sub").textContent = "The " + r + " is too close to go anywhere.";
    } else {
      $("big").innerHTML = "You have <b>" + m + " minutes</b>";
      $("sub").textContent = "That is a " + reachMin.toFixed(1).replace(".0", "") +
        " minute walk each way. Anywhere inside the ring, you can get there and be back before the " + r + " comes.";
    }
    $("count").textContent = n + " of " + PLACES.length + " within reach";
  }

  function setLive(on, label){
    live = on;
    var e = $("lv");
    e.className = "lv" + (on ? " on" : "");
    e.innerHTML = on ? "\u25CF LIVE" : "\u25CB " + (label || "OFFLINE");
  }

  function tick(){
    if(arriving) return;
    ROUTES.forEach(function(x){
      if(!tracked[x]) return;
      eta[x]--;
      if(eta[x] <= 0) startArriving(x);
    });
    draw();
  }
  function tickMs(){ return (live && !demoSpeed) ? REAL_MIN_MS : DEMO_MIN_MS; }
  function restartTick(){ clearInterval(tickHandle); tickHandle = setInterval(tick, tickMs()); }

  function startArriving(r){
    arriving = r; eta[r] = 0; draw();
    $("fr").textContent = r;
    $("flash").classList.add("on");
    document.body.classList.add("arriving");
    setTimeout(function(){
      $("flash").classList.remove("on");
      document.body.classList.remove("arriving");
      eta[r] = Math.max(4, SEED[r] + Math.floor(Math.random()*5) - 2);
      arriving = null; draw();
    }, ARRIVE_MS);
  }

  // Same serverless function as prototypes A and B.
  function poll(){
    fetch("/api/septa", { cache:"no-store" })
      .then(function(res){ if(!res.ok) throw new Error(res.status); return res.json(); })
      .then(function(d){
        (d.arrivals || []).forEach(function(a){
          if(ROUTES.indexOf(a.route) < 0) return;
          if(a.destination) dest[a.route] = a.destination;
          if(typeof a.minutes === "number"){
            tracked[a.route] = true;
            eta[a.route] = Math.max(1, a.minutes);
            lateMin[a.route] = typeof a.late === "number" ? a.late : null;
            if(!arriving && a.minutes <= 1) startArriving(a.route);
          } else {
            tracked[a.route] = false;
            lateMin[a.route] = null;
          }
        });
        setLive(true); draw();
      })
      .catch(function(){ setLive(false, "demo data"); })
      .then(function(){ restartTick(); setTimeout(poll, POLL_MS); });
  }

  draw(); restartTick(); poll();

  // Recording helpers: b = arrive now, d = demo speed, l = fake delay, r = reset
  document.addEventListener("keydown", function(e){
    if(e.key === "b" && !arriving) startArriving(soonest() || "21");
    if(e.key === "d"){ demoSpeed = !demoSpeed; restartTick(); }
    if(e.key === "l"){
      var s = soonest() || "21";
      lateMin[s] = (typeof lateMin[s] === "number" && lateMin[s] >= 2) ? 0 : 6;
      draw();
    }
    if(e.key === "r"){
      ROUTES.forEach(function(x){ eta[x] = SEED[x]; tracked[x] = true; lateMin[x] = null; });
      draw();
    }
  });
})();
</script>
